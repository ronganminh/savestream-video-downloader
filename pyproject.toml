[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savestream-video-downloader"
version = "0.2.0"
description = "SaveStream internal video downloader microservice with provider fallback."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.14",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "prometheus-client==0.22.1",
  "redis==5.2.1",
  "uvicorn==0.34.3",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.9.10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
